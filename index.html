<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hustle Hustle TW 課程報名</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-logo">Hustle Hustle TW</div>
    <button id="lang-toggle">EN</button>
  </header>

  <nav class="steps">
    <div class="step-item active">
      <div class="step-num"><span>1</span></div>
      <div class="step-label">選課程</div>
    </div>
    <div class="step-item">
      <div class="step-num"><span>2</span></div>
      <div class="step-label">選方案</div>
    </div>
    <div class="step-item">
      <div class="step-num"><span>3</span></div>
      <div class="step-label">填資料</div>
    </div>
    <div class="step-item">
      <div class="step-num"><span>4</span></div>
      <div class="step-label">匯款</div>
    </div>
  </nav>

  <main id="main"></main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
