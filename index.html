<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hustle Hustle TW 課程報名</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="landing">
  <header class="site-header">
    <a href="index.html" class="site-logo">
      <img src="logo.jpg" alt="Hustle Hustle TW" class="site-logo-img">
    </a>
    <div class="nav-right">
      <button id="lang-toggle" class="pill">EN</button>
    </div>
  </header>

  <!-- Hero 開場 -->
  <section class="stage" id="hero">
    <div class="tile t1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="tile t2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="tile t3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="tile t4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="tile t5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="tile t6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="tile t7"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <div class="tile t8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>

    <div class="eyebrow" id="hero-eyebrow">在 Hustle Hustle，盡情</div>
    <div class="word-wrap"><span class="word" id="word">Hustle</span></div>
    <p class="lead" id="hero-lead"></p>
    <div class="cta">
      <button class="pill solid" id="hero-start">開始報名</button>
    </div>
    <p class="fineprint" id="hero-fine">新生首堂體驗價・名額有限</p>
  </section>
  </div>

  <!-- Hero → 報名 的緩衝帶：貓咪從波浪後探出（貓在底層，波浪遮罩疊在前面） -->
  <div class="hero-transition" aria-hidden="true">
    <img class="hero-cats" src="cats.png" alt="">
    <div class="hero-wave"></div>
  </div>

  <nav class="steps">
    <div class="step-item active">
      <div class="step-num"><span>1</span></div>
      <div class="step-label">選課程</div>
    </div>
    <div class="step-item">
      <div class="step-num"><span>2</span></div>
      <div class="step-label">選方案</div>
    </div>
    <div class="step-item">
      <div class="step-num"><span>3</span></div>
      <div class="step-label">填資料</div>
    </div>
    <div class="step-item">
      <div class="step-num"><span>4</span></div>
      <div class="step-label">匯款</div>
    </div>
  </nav>

  <main id="main"></main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
